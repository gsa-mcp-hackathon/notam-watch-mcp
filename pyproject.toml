[project]
name = "nfs-mcp-server"
version = "0.2.0"
description = "NFS MCP server: flight and NOTAM tools over the PostGIS gold layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic-settings>=2.0.0",
    "databricks-sdk>=0.40.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
nfs-mcp = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
# The ingestion jobs (ingestion/, not part of the MCP server package) also
# need these; see ingestion/requirements.txt.
ingestion = [
    "requests>=2.32.0",
    "solace-pubsubplus>=1.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["server", "nfs_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests", "ingestion/tests"]
pythonpath = ["src", "ingestion"]
asyncio_mode = "auto"
